# Isolated public landing on parkskazka.ru; do not pass it to Moguta CMS.
location = /snow-mail {
    return 301 /snow-mail/;
}

location = /snow-mail/api/lead {
    access_log off;
    client_max_body_size 16k;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/parkskazka-snow-mail-api/lead/index.php;
    fastcgi_param SCRIPT_NAME /snow-mail/api/lead;
    fastcgi_pass unix:/run/php/php8.3-fpm-snow-mail.sock;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /snow-mail/ {
    # PHP and hidden files are never served as static text.
    if ($uri ~* "(?:\.php$|/\.)") { return 404; }
    root /var/www/parkskazka.ru;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
